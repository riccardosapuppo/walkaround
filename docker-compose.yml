# La configurazione arriva da un .env accanto a questo file, che NON e'
# versionato. Qui dentro c'erano le password vere, in chiaro, due volte.
#
# La sintassi ${VAR:?messaggio} fa fallire `docker compose up` quando la
# variabile manca, invece di partire con una stringa vuota: un database che
# accetta la password vuota e' peggio di un avvio fallito.
#
#     echo "DB_PASSWORD=$(openssl rand -base64 24)" > .env
#     docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: tourism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: turismo_db_dev
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: ${DB_PASSWORD:?serve DB_PASSWORD, mettila in un .env accanto a questo file}
    ports:
      - '5433:5432'
    volumes:
      - tourism_pgdata:/var/lib/postgresql/data
    networks:
      - tourism-net
  backend:
    build:
      context: ./backend
    container_name: tourism-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: turismo_db_dev
      DB_USER: walkaround
      DB_PASSWORD: ${DB_PASSWORD:?serve DB_PASSWORD, mettila in un .env accanto a questo file}
      # if-empty per difetto: chi fa `docker compose up` deve trovarci
      # dentro il catalogo, non un'applicazione vuota. Era `never`, e su
      # un'installazione nuova non si vedeva niente e non lo spiegava nessuno.
      # Con DB_SEED_MODE=never nel .env si torna al comportamento di prima.
      DB_SEED_MODE: ${DB_SEED_MODE:-if-empty}
    ports:
      - '3001:3000'
    volumes:
      - tourism_public:/app/public
    networks:
      - tourism-net
  frontend:
    build:
      context: ./frontend
    container_name: tourism-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'
    networks:
      - tourism-net
networks:
  tourism-net:
    driver: bridge
volumes:
  tourism_pgdata:
  tourism_public:
