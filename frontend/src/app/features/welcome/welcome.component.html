<section class="welcome page-shell">
  <img class="hero" src="/public/images/catania/piazza-duomo-ct.jpg" alt="Catania e Etna" />

  <h1 class="page-title">Scopri la città intorno a te</h1>
  <p class="page-subtitle">Audio guide automatiche nei luoghi che visiti</p>

  <div class="welcome-actions">
    <button mat-flat-button color="primary" class="big-cta" (click)="start()">Inizia</button>

    <button mat-button color="primary" (click)="showCodeInput = !showCodeInput">
      Inserisci codice hotel
    </button>
  </div>

  <section class="code-box card" *ngIf="showCodeInput">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Codice hotel</mat-label>
      <input matInput [(ngModel)]="hotelCode" autocomplete="off" />
    </mat-form-field>

    <button mat-stroked-button color="primary" [disabled]="isCheckingCode" (click)="validateCode()">
      {{ isCheckingCode ? 'Controllo in corso...' : 'Salva e sblocca' }}
    </button>
  </section>
</section>
