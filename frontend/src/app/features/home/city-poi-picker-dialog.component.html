<h2 mat-dialog-title>{{ 'cityPicker.title' | t:{ city: data.cityName } }}</h2>

<mat-dialog-content class="picker-content">
  <p class="picker-subtitle">{{ 'cityPicker.subtitle' | t }}</p>

  <div class="picker-toolbar">
    <button mat-button type="button" (click)="selectAllLocked()">{{ 'cityPicker.selectAllLocked' | t }}</button>
    <button mat-button type="button" (click)="clearSelection()">{{ 'cityPicker.clear' | t }}</button>
  </div>

  <div class="picker-list">
    <button
      type="button"
      class="picker-row"
      *ngFor="let poi of data.pois"
      [class.unlocked]="poi.unlocked"
      [class.selected]="isSelected(poi.id)"
      (click)="togglePoi(poi)"
    >
      <div class="picker-row-main">
        <strong>{{ poi.name }}</strong>
        <small>{{ poi.distanceLabel }} &middot; {{ poi.durationSec | durationLabel }}</small>
        <p>{{ poi.descriptionShort }}</p>
      </div>

      <div class="picker-row-meta">
        <span *ngIf="poi.unlocked" class="status-pill unlocked">{{ 'cityPicker.unlocked' | t }}</span>
        <span *ngIf="!poi.unlocked" class="status-pill locked">
          {{ isSelected(poi.id) ? ('cityPicker.selected' | t) : ('cityPicker.select' | t) }}
        </span>
        <strong *ngIf="!poi.unlocked">{{ formatPrice(poi.priceSingle) }}</strong>
      </div>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="picker-actions">
  <div class="picker-summary" [class.has-selection]="selectedCount > 0">
    <span class="picker-summary-count">{{ 'cityPicker.selectedCount' | t:{ count: selectedCount } }}</span>
    <p class="picker-summary-total">
      {{ 'cityPicker.singleTotal' | t }}
      <strong>{{ formatPrice(selectedTotal) }}</strong>
    </p>
  </div>

  <div class="picker-action-buttons">
    <button mat-button mat-dialog-close>{{ 'common.cancel' | t }}</button>
    <button mat-stroked-button color="primary" type="button" (click)="purchaseCityBundle()">
      {{ 'cityPicker.unlockCity' | t:{ price: cityBundlePriceLabel() } }}
    </button>
  </div>

  <div class="picker-primary-cta">
    <button mat-flat-button color="primary" type="button" [disabled]="selectedCount === 0" (click)="confirmSelection()">
      {{ selectionCtaLabel }}
    </button>
  </div>
</mat-dialog-actions>
