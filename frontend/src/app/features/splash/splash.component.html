<section class="splash">
  <div class="logo-wrap">
    <div class="logo-circle">
      <img src="/assets/logo.png" [attr.alt]="'common.appName' | t" loading="eager" decoding="sync" fetchpriority="high" />
    </div>
    <h1>{{ 'common.appName' | t }}</h1>
    <p>{{ 'splash.tagline' | t }}</p>
  </div>

  <img src="/public/images/catania/piazza-duomo-ct.jpg" [attr.alt]="'splash.heroAlt' | t" />
</section>
