<div class="unlock-dialog">
  <div class="dialog-top">
    <div class="dialog-icon" aria-hidden="true">
      <mat-icon fontSet="material-icons-round">vpn_key</mat-icon>
    </div>
    <div>
      <h2 mat-dialog-title>Codice sblocco</h2>
      <p class="dialog-subtitle">Inserisci il codice.</p>
    </div>
  </div>

  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Codice</mat-label>
      <input
        matInput
        [formControl]="codeControl"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        (keyup.enter)="confirm()"
      />
      <mat-error *ngIf="codeControl.invalid && codeControl.touched">Inserisci un codice valido.</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close()">Annulla</button>
    <button mat-flat-button color="primary" type="button" (click)="confirm()">Conferma</button>
  </mat-dialog-actions>
</div>
